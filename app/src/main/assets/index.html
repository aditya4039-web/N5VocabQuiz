  clearInterval(tm);locked=false;paused=false;
  const c=q[i],w=c.w,tp=inp=="type";let pr,opts,ans,show,sp,lab;
  if(mode=="cj"){
    const C=conj(w)[c.f];
    pr=`<div class="jp">${w.k} ${spk(w.h)}</div><div class="mu">${[rd(w),w.m].filter(Boolean).join(" · ")}</div><div class="fm">${FN[c.f]}?</div>`;
    const d=[...sh(wrongs(w,c.f)),...sh(Object.entries(conj(w)).filter(e=>e[0]!=c.f).map(e=>e[1]))].filter((x,j,a)=>x!=C&&a.indexOf(x)==j).slice(0,3);
    opts=sh([C,...d]).map(x=>({h:x,ok:x==C}));ans=[C];show=C;sp=C;lab=w.k;
  }else{
    const sim=x=>(x.h==w.h?3:0)+[...w.k].filter(ch=>ch>"一"&&x.k.includes(ch)).length*2;
    const jpq=mode=="jp"&&!tp;
    const cand=src().filter(x=>x.id!=w.id&&(jpq?x.m!=w.m:x.k+x.h!=w.k+w.h));
    const near=sh(cand).sort((a,b)=>sim(b)-sim(a)).filter(x=>sim(x)>0).slice(0,2);
    const d=[...near,...sh(cand.filter(x=>!near.includes(x)))].slice(0,3);
    const fw=disp(w);
    pr=jpq?`<div class="jp">${fw.k.replace(" / ","<br>")} ${spk(fw.s||fw.h)}</div><div class="mu">${rd(fw).replace(" / ","<br>")}</div>`:`<div class="en">${w.m}</div>${w.t=="v"?`<div class="fm">ます-form + て-form</div>`:""}`;
    opts=sh([w,...d]).map(o=>{const x=disp(o);return{h:jpq?o.m:`<b>${x.k}</b> <small>${rd(x)}</small>`,ok:o.id==w.id}});
    ans=fw.a;show=`${fw.k}${fw.h!=fw.k?" ("+fw.h+")":""}`;sp=fw.s||fw.h;lab=fw.k;
  }
  Q={c,w,opts,ans,show,tp,sp,lab};
  nav(false);
  app.innerHTML=`<div class="qrow"><button class="lnk" id="qt">Quit</button>${timed?`<button class="lnk" id="ps">Pause</button>`:""}</div><div class="top"><span>${c.rq?"Retry · ":""}Question ${Math.min(i+1,q.length)} / ${q.length}</span><span>Score ${sc}/${tot}${timed?` · <b id="tm">${secs}s</b>`:""}</span></div>
  <div class="bar"><i style="width:${i/q.length*100}%"></i></div>
  <div class="q" id="qb">${pr}</div>
  <div id="ob">${tp?`<input class="ti" id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${w.t=="v"&&mode!="cj"?"ます-form て-form (kana)":"type in kana"}"><button class="pri" id="ck">Check</button>`:opts.map((o,n)=>`<button class="opt">${n+1}. ${o.h}</button>`).join("")}</div><div id="nx"></div>`;
  if(tp){$("#ti").focus();$("#ck").onclick=sub;$("#ti").onkeydown=e=>{if(e.key=="Enter"){e.stopPropagation();sub()}}}
  else document.querySelectorAll(".opt").forEach((b,n)=>b.onclick=()=>finish(opts[n].ok,false,n));
  $("#qt").onclick=()=>{clearInterval(tm);home()};
  if(timed){left=secs;tick();$("#ps").onclick=()=>{if(locked)return;paused=!paused;$("#ps").textContent=paused?"Resume":"Pause";[$("#qb"),$("#ob")].forEach(e=>e.style.visibility=paused?"hidden":"");paused?clearInterval(tm):tick()}}
}
const tick=()=>{clearInterval(tm);tm=setInterval(()=>{left--;const t=$("#tm");if(t)t.textContent=left+"s";if(left<=0)finish(false,true)},1000)};
function sub(){if(locked)return;const v=norm($("#ti").value);if(!v)return;finish(Q.ans.map(norm).includes(v),false)}
function finish(ok,soft,idx){
  if(locked||paused)return;locked=true;clearInterval(tm);
  const{c,w,opts,ans,show,tp,sp,lab}=Q;
  if(tp){const ti=$("#ti");ti.disabled=true;ti.className="ti "+(ok?"ok":"no");$("#ck").style.display="none"}
  else document.querySelectorAll(".opt").forEach((b,n)=>{if(opts[n].ok)b.classList.add("ok");else if(n===idx)b.classList.add("no")});
  rec(w,ok,soft);
  if(ok&&!c.rq)sc++;
  if(!ok&&!c.rq){miss.push(w);q.splice(Math.min(i+4,q.length),0,{w,f:c.f,vf:c.vf,rq:1})}
  const e=D[w.id];
  $("#nx").innerHTML=`<div class="mu" style="text-align:center;margin-top:12px">${soft?"Time's up · ":""}${!ok&&tp?"Answer: <b>"+show+"</b> · ":""}${lab} ${fm(e.s)} · review ${due(e)} ${spk(sp)}</div><button class="pri" id="n">${i+1<q.length?"Next":"See results"}</button>`;
  $("#n").onclick=next;
  if(aud)say(sp);
}
function next(){i++;i<q.length?ask():done()}
function done(){
  nav(true,"home");scrollTo(0,0);
  app.innerHTML=`<h1>Results</h1><div class="score">${sc} / ${tot}</div><div class="mu" style="text-align:center">${sc==tot?"Perfect round!":miss.length+" to review"}</div>
  ${miss.map(w=>`<div class="row"><span>${w.k} <small class="mu">${w.h!=w.k?w.h:""}</small></span><span>${w.m}</span></div>`).join("")}
  <button class="pri" id="again">Smart review</button>${miss.length?`<button class="sec" id="rm">Retry missed words</button>`:""}<button class="lnk" id="hm">Back to menu</button>`;
  $("#again").onclick=review;if(miss.length)$("#rm").onclick=()=>start(miss);$("#hm").onclick=home;
}
function progress(){
  nav(true,"pg");scrollTo(0,0);
  const t=Date.now(),seen=Object.keys(D).length,dn=W.filter(w=>D[w.id]&&D[w.id].d<=t).length,ms=W.filter(w=>D[w.id]&&D[w.id].b>=4).length;
  const days=[];for(let k=6;k>=0;k--){const d=new Date(t-k*DAY).toLocaleDateString("sv");days.push([d.slice(5),ST.days[d]||[0,0]])}
  const L=W.slice().sort((a,b)=>sc0(a)-sc0(b));
  app.innerHTML=`<h1>Progress</h1>
  <div class="cards"><div><b>${streak()}</b><small>day streak</small></div><div><b>${dn}</b><small>due now</small></div><div><b>${ms}</b><small>mastered</small></div><div><b>${seen}/${W.length}</b><small>seen</small></div></div>
  <div class="mu">Last 7 days · correct / answered</div>
  <div class="spark">${days.map(([d,x])=>`<div><i style="height:${x[0]?Math.max(6,x[1]/x[0]*60):2}px"></i><small>${d}</small><small>${x[0]?x[1]+"/"+x[0]:"–"}</small></div>`).join("")}</div>
  <div class="mu" style="margin:12px 0 4px">Weakest first · right +1 · wrong −0.5 · mastered = 4+ correct in a row</div>
  ${L.map(w=>{const e=D[w.id],c=!e?"var(--mu)":e.s<0?"var(--no)":e.b>=4?"var(--ok)":"var(--tx)";return`<div class="row" data-w="${w.id}"><span>${w.k} <small class="mu">${w.h!=w.k?w.h:""}</small><br><small class="mu">${w.m}</small></span><span style="color:${c}"><b>${e?fm(e.s):"new"}</b><br><small>${e?due(e):""}</small></span></div>`}).join("")}`;
}
function backup(){
  nav(true,"st");scrollTo(0,0);
  app.innerHTML=`<h1>Backup</h1><div class="mu">Copy this code and keep it safe. Paste it on any device to restore your progress.</div><textarea id="bk" readonly>${btoa(JSON.stringify({D,ST}))}</textarea><button class="sec" id="cp">Copy code</button>
  <div class="mu" style="margin-top:20px">Restore from a code (replaces current progress):</div><textarea id="rs" placeholder="Paste code here"></textarea><button class="sec" id="rr">Restore</button><div class="mu" id="msg"></div><button class="lnk" id="hm">Back</button>`;
  const m=t=>$("#msg").textContent=t;
  $("#cp").onclick=()=>{const t=$("#bk");t.select();try{navigator.clipboard.writeText(t.value).then(()=>m("Copied."),()=>m("Select the text and copy it manually."))}catch(e){m("Select the text and copy it manually.")}};
  $("#rr").onclick=()=>{try{const o=JSON.parse(atob($("#rs").value.trim()));if(!o.D)throw 0;D=o.D;ST=Object.assign({days:{}},o.ST);save();m("Restored "+Object.keys(D).length+" words.")}catch(e){m("That code didn't work.")}};
  $("#hm").onclick=settings;
}
function card(id){
  const w=W[id],e=D[id],x=EX[w.k],c=w.t=="v"?conj(w):null,ck=w.t=="v"?conj(w,true):null;
  let o=$("#fc");if(!o){o=document.createElement("div");o.id="fc";document.body.appendChild(o)}
  o.innerHTML=`<div class="fcb"><button class="x" id="fx" aria-label="Close">${IC.x}</button>
  <div class="jp">${w.k}</div><div class="mu">${w.h!=w.k?w.h:""} ${spk(w.h)}</div>
  <div class="en" style="margin-top:10px">${w.m}</div>
  ${c?`<div class="forms">${["masu","te","nai"].map(f=>`<span>${ck[f]}${ck[f]!=c[f]?`<small>${c[f]}</small>`:""}</span>`).join("")}</div><div class="mu">ます · て · ない</div>`:""}
  ${x?`<div class="ex"><div class="mu">Example</div><div class="exj">${fur(x[0])} ${spk(pl(x[0]))}</div><div class="mu">${x[1]}</div></div>`:""}
  <div class="mu" style="margin-top:14px">${e?"Score "+fm(e.s)+" · review "+due(e):"Not practiced yet"}</div></div>`;
  o.style.display="flex";o.onclick=ev=>{if(ev.target===o||ev.target.closest("#fx"))o.style.display="none"};
}
document.addEventListener("click",e=>{const s=e.target.closest("[data-say]");if(s)return say(s.dataset.say);const r=e.target.closest("[data-w]");if(r)card(+r.dataset.w)});
document.addEventListener("keydown",e=>{
  if(e.key=="Escape"){const o=$("#fc");if(o)o.style.display="none"}
  if(paused)return;
  const bs=document.querySelectorAll(".opt");
  if(bs.length&&!locked&&e.key>="1"&&e.key<="4"){bs[+e.key-1]&&bs[+e.key-1].click()}
  else if(e.key=="Enter"&&locked&&$("#n")){e.preventDefault();$("#n").click()}
});
home();
</script></body></html>
